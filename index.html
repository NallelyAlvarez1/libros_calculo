<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Libros</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      color: #2c3e50;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2c7be5;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #1b5fc1;
    }

    .resultado {
      margin-top: 30px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #dbe2ea;
    }

    .resultado h2 {
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .resultado p {
      margin-bottom: 10px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th,
    table td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    table th {
      background: #2c7be5;
      color: white;
    }

    .precio-final {
      font-size: 28px;
      font-weight: bold;
      color: #27ae60;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calculadora de Libros Anillados</h1>

    <div class="grid">

      <div class="field">
        <label>Páginas del PDF</label>
        <input type="number" id="paginas" placeholder="Ej: 200">
      </div>

      <div class="field">
        <label>Tamaño</label>
        <select id="tamano">
          <option value="carta">Carta</option>
          <option value="media">Media Carta</option>
        </select>
      </div>

      <div class="field">
        <label>Tipo de impresión</label>
        <select id="tipo">
          <option value="bn">Blanco y Negro</option>
          <option value="color">Color</option>
        </select>
      </div>

      <div class="field">
        <label>Tipo de portada</label>
        <select id="portadaTipo">
          <option value="mica">Mica Normal</option>
          <option value="termolaminado">Termolaminado</option>
        </select>
      </div>

      <div class="field">
        <label>Margen multiplicador</label>
        <input type="number" id="margen" value="2.5" step="0.1" disabled>
      </div>

    </div>

    <button onclick="calcular()">Calcular Precio</button>

    <div class="resultado" id="resultado" style="display:none;">
      <h2>Resultado</h2>

      <p id="hojasReales"></p>
      <p id="espiral"></p>
      <p id="materiales"></p>
      <p id="papel"></p>
      <p id="tinta"></p>
      <p id="costo"></p>

      <div class="precio-final" id="precioFinal"></div>

      <table>
        <thead>
          <tr>
            <th>Páginas PDF</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody id="tablaPrecios"></tbody>
      </table>

    </div>
  </div>

  <script>

    const costos = {
      espirales: [
        { max: 50, nombre: '10 mm', costo: 76 },
        { max: 75, nombre: '12 mm', costo: 152 },
        { max: 85, nombre: '14 mm', costo: 152 },
        { max: 140, nombre: '18 mm', costo: 180 },
        { max: 165, nombre: '20 mm', costo: 180 }
      ],
      mica: 100,
      termolaminado: 130,
      papelPorHoja: 14,
      tintaBN: 2,
      tintaColor: 10
    };

    function obtenerEspiral(hojas) {
      for (let espiral of costos.espirales) {
        if (hojas <= espiral.max) {
          return espiral;
        }
      }

      return {
        nombre: 'Mayor a 20 mm',
        costo: 250
      };
    }

    function calcularPrecio(paginas, tamano, tipo, portadaTipo, margen) {

      let hojas;

      if (tamano === 'carta') {
        hojas = Math.ceil(paginas / 2);
      } else {
        hojas = Math.ceil(paginas / 4);
      }

      const espiral = obtenerEspiral(hojas);

      const costoPapel = hojas * costos.papelPorHoja;

      const tintaPorHoja = tipo === 'color'
        ? costos.tintaColor
        : costos.tintaBN;

      const costoTinta = hojas * tintaPorHoja;

      const costoPortada = portadaTipo === 'termolaminado'
        ? costos.termolaminado
        : costos.mica;

      const materiales = espiral.costo + costoPortada;

      const costoTotal = costoPapel + costoTinta + materiales;

      const precioFinal = Math.ceil(costoTotal * margen / 10) * 10;

      return {
        hojas,
        espiral,
        costoPapel,
        costoTinta,
        materiales,
        costoTotal,
        precioFinal
      };
    }

    function calcular() {

      const paginas = parseInt(document.getElementById('paginas').value);
      const tamano = document.getElementById('tamano').value;
      const tipo = document.getElementById('tipo').value;
      const portadaTipo = document.getElementById('portadaTipo').value;
      const margen = parseFloat(document.getElementById('margen').value);

      if (!paginas || paginas <= 0) {
        alert('Ingresa una cantidad válida de páginas');
        return;
      }

      const resultado = calcularPrecio(paginas, tamano, tipo, portadaTipo, margen);

      document.getElementById('resultado').style.display = 'block';

      document.getElementById('hojasReales').innerHTML =
        `<strong>Hojas reales:</strong> ${resultado.hojas}`;

      document.getElementById('espiral').innerHTML =
        `<strong>Espiral:</strong> ${resultado.espiral.nombre}`;

      document.getElementById('materiales').innerHTML =
        `<strong>Materiales:</strong> $${resultado.materiales.toLocaleString('es-CL')}`;

      document.getElementById('papel').innerHTML =
        `<strong>Papel:</strong> $${resultado.costoPapel.toLocaleString('es-CL')}`;

      document.getElementById('tinta').innerHTML =
        `<strong>Tinta:</strong> $${resultado.costoTinta.toLocaleString('es-CL')}`;

      document.getElementById('costo').innerHTML =
        `<strong>Costo total:</strong> $${resultado.costoTotal.toLocaleString('es-CL')}`;

      document.getElementById('precioFinal').innerHTML =
        `Precio sugerido: $${resultado.precioFinal.toLocaleString('es-CL')}`;

      generarTabla(tamano, tipo, portadaTipo, margen);
    }

    function generarTabla(tamano, tipo, portadaTipo, margen) {

      const tbody = document.getElementById('tablaPrecios');
      tbody.innerHTML = '';

      for (let paginas = 10; paginas <= 320; paginas += 10) {

        const r = calcularPrecio(paginas, tamano, tipo, portadaTipo, margen);

        const fila = `
          <tr>
            <td>${paginas}</td>
            <td>$${r.precioFinal.toLocaleString('es-CL')}</td>
          </tr>
        `;

        tbody.innerHTML += fila;
      }
    }

  </script>

</body>
</html>
